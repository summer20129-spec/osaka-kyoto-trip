<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪・京都 五日紀行 | OSAKA · KYOTO 5 Days Journey</title>
<meta name="description" content="2026.11.03 — 11.07 大阪・京都五日旅遊行程">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ============ HERO ============ -->
<header class="hero">
  <div class="hero__inner">
    <p class="hero__eyebrow">OSAKA · KYOTO</p>
    <h1 class="hero__title">5 Days Journey</h1>
    <p class="hero__dates">2026.11.03 — 11.07</p>
    <p class="hero__local">大阪・京都 五日紀行</p>
    <ul class="hero__stats" id="hero-stats" aria-label="Trip summary">
      <!-- injected by app.js -->
    </ul>
  </div>
</header>

<!-- ============ TRIP OVERVIEW ============ -->
<section class="overview" id="overview" aria-labelledby="overview-heading">
  <h2 id="overview-heading" class="section-heading">Trip Overview</h2>
  <div class="overview__grid" id="overview-grid">
    <!-- injected by app.js -->
  </div>
</section>

<!-- ============ PRE-TRIP CHECKLIST ============ -->
<section class="checklist" id="checklist" aria-labelledby="checklist-heading">
  <details class="checklist__details">
    <summary class="checklist__summary">
      <h2 id="checklist-heading" class="section-heading">Pre-Trip Checklist</h2>
      <span class="checklist__progress" id="checklist-progress" aria-live="polite"></span>
    </summary>
    <div class="checklist__body" id="checklist-body">
      <!-- injected by app.js -->
    </div>
  </details>
</section>

<!-- ============ DAY NAVIGATION (sticky) ============ -->
<nav class="day-nav" id="day-nav" aria-label="Day navigation">
  <div class="day-nav__scroll" id="day-nav-scroll">
    <!-- injected by app.js -->
  </div>
</nav>

<!-- ============ MAIN: DAILY ITINERARY ============ -->
<main id="main">
  <div class="days" id="days">
    <!-- injected by app.js -->
  </div>

  <!-- ============ TRAVEL NOTES ============ -->
  <section class="travel-notes" id="travel-notes" aria-labelledby="travel-notes-heading">
    <h2 id="travel-notes-heading" class="section-heading">Travel Notes</h2>
    <div class="travel-notes__grid" id="travel-notes-grid">
      <!-- injected by app.js -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>大阪・京都 五日紀行 · 2026.11.03 — 11.07</p>
</footer>

<script src="data/itinerary.js"></script>
<script src="js/app.js"></script>
</body>
</html>
